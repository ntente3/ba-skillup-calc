# Skill-up calculator - static serving config (NAS)
#
# There is no backend. Serving files verbatim is the whole job.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Keep access logs, but drop the health-check noise
    access_log   /var/log/nginx/access.log;

    # The data changes rarely, so cache generously; but an update must show up
    # immediately, so files without a content hash are revalidated.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";   # cache, but revalidate every time
    }

    # Icon filenames change whenever their content does, so cache them long.
    location /web/icons/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # JSON compresses extremely well (game data: 377KB raw -> 34KB gzipped)
    gzip              on;
    gzip_types        text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    gzip_vary         on;

    # Fonts are the only outbound request this app makes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Belt-and-braces: never serve these even if a mount is misconfigured
    location ~ /\.(git|env) { deny all; return 404; }
}
